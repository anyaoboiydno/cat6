<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="flex.css">
    <link rel="stylesheet" href="style-accordion.css">
</head>
<body>
    <div class="container">
        <div class="main-content-column">
            <header class="block-1">
                <div class="header-text">
                    <p>Admin Page</p>
                </div>
                <div class="inner-box">
                    <h2>Admin</h2>
                </div>
            </header>

            <main class="block-3">
                <h1>Accordion Builder</h1>
                
                <div id="creation-form">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" id="acc-title">
                    </div>
                    <div class="form-group">
                        <label>Content:</label>
                        <textarea id="acc-content" rows="3"></textarea>
                    </div>
                    <button id="btn-add" class="btn btn-add">Add Item</button>
                    <button id="btn-save" class="btn btn-save">Save to Server</button>
                </div>

                <h3>Preview:</h3>
                <div id="preview-list"></div>
            </main>

            <footer class="block-4">
                <div class="inner-box">
                    <h3>catcatcat</h3>
                </div>
                <div class="header-text">
                    <p>CATS TOP</p>
                </div>
            </footer>
        </div>

        <div class="gutter"></div>

        <div class="sidebar-column">
            <aside class="block-2">
                <nav>
                    <ul>
                        <li><a href="admin.html" class="active">Admin</a></li>
                        <li><a href="view.html">View</a></li>
                    </ul>
                </nav>
            </aside>
            <div class="block-5">
                <p>Info</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
